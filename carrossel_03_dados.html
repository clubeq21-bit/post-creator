<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --dourado: #C9A96E;
    --dourado-claro: #E8C98A;
    --bg-escuro: #1A1510;
    --texto-claro: #F5EFE6;
    --texto-sutil: #9A8870;
    --terracota: #C1622A;
  }

  body {
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    background: var(--bg-escuro);
    font-family: 'Playfair Display', Georgia, serif;
  }

  .slide {
    width: 1080px;
    height: 1350px;
    background: var(--bg-escuro);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
  }

  .slide::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 40%, rgba(201,169,110,0.07) 0%, transparent 65%);
  }

  .linha-topo {
    position: absolute;
    top: 55px;
    left: 60px;
    right: 60px;
    height: 1.5px;
    background: linear-gradient(to right, var(--dourado), rgba(201,169,110,0.3));
  }

  .tag {
    position: absolute;
    top: 75px;
    left: 60px;
    color: var(--dourado);
    font-size: 15px;
    font-weight: 400;
    letter-spacing: 6px;
    text-transform: uppercase;
  }

  /* Bloco de dado 1 — grande */
  .dado-principal {
    position: absolute;
    top: 150px;
    left: 60px;
    right: 60px;
  }

  .numero-gigante {
    font-size: 220px;
    font-weight: 900;
    color: var(--dourado);
    line-height: 0.85;
    letter-spacing: -6px;
  }

  .contexto-numero {
    margin-top: 24px;
    font-size: 36px;
    font-weight: 400;
    line-height: 1.4;
    color: var(--texto-claro);
    max-width: 860px;
  }

  .contexto-numero strong {
    font-weight: 700;
    color: var(--dourado-claro);
  }

  /* Separador */
  .divisor-dado {
    position: absolute;
    top: 640px;
    left: 60px;
    right: 60px;
    height: 1px;
    background: rgba(201,169,110,0.25);
  }

  /* Bloco de dado 2 */
  .dado-secundario {
    position: absolute;
    top: 680px;
    left: 60px;
    right: 60px;
  }

  .numero-medio {
    font-size: 130px;
    font-weight: 900;
    color: var(--terracota);
    line-height: 0.9;
    letter-spacing: -3px;
  }

  .contexto-numero-2 {
    margin-top: 20px;
    font-size: 34px;
    font-weight: 400;
    line-height: 1.45;
    color: var(--texto-claro);
    max-width: 860px;
  }

  .contexto-numero-2 strong {
    font-weight: 700;
  }

  /* Fonte */
  .fonte {
    position: absolute;
    bottom: 130px;
    left: 60px;
    font-size: 16px;
    color: var(--texto-sutil);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .linha-base {
    position: absolute;
    bottom: 100px;
    left: 60px;
    right: 60px;
    height: 1px;
    background: rgba(201,169,110,0.2);
  }

  .handle {
    position: absolute;
    bottom: 62px;
    left: 60px;
    color: var(--dourado);
    font-size: 19px;
    font-weight: 400;
    letter-spacing: 3px;
  }

  .slide-label {
    position: absolute;
    bottom: 65px;
    right: 60px;
    color: var(--texto-sutil);
    font-size: 14px;
    letter-spacing: 3px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="slide">
  <div class="linha-topo"></div>
  <div class="tag">Os Dados</div>

  <div class="dado-principal">
    <div class="numero-gigante">80%</div>
    <p class="contexto-numero">
      das vendas exigem <strong>no mínimo 5 tentativas<br>de follow-up</strong> após o primeiro contato.
    </p>
  </div>

  <div class="divisor-dado"></div>

  <div class="dado-secundario">
    <div class="numero-medio">44%</div>
    <p class="contexto-numero-2">
      dos profissionais desistem<br>
      <strong>após a primeira tentativa.</strong><br>
      E depois culpam a oferta.
    </p>
  </div>

  <div class="fonte">Fonte: HubSpot Sales Research · Marketing Donut</div>
  <div class="linha-base"></div>
  <div class="handle">@glendonassis</div>
  <div class="slide-label">03 / 09</div>
</div>
</body>
</html>
