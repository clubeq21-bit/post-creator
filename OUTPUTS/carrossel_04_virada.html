<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --dourado: #C9A96E;
    --dourado-claro: #E8C98A;
    --bg-escuro: #1A1510;
    --bg-medio: #221C14;
    --texto-claro: #F5EFE6;
    --texto-sutil: #9A8870;
    --terracota: #C1622A;
  }

  body {
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    background: var(--bg-escuro);
    font-family: 'Playfair Display', Georgia, serif;
  }

  .slide {
    width: 1080px;
    height: 1350px;
    background: var(--bg-escuro);
    position: relative;
    overflow: hidden;
  }

  /* Faixa dourada lateral */
  .faixa-lateral {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 6px;
    background: linear-gradient(to bottom, var(--dourado), rgba(201,169,110,0.2));
  }

  .slide::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 90% 60%, rgba(201,169,110,0.06) 0%, transparent 55%);
  }

  .linha-topo {
    position: absolute;
    top: 55px;
    left: 60px;
    right: 60px;
    height: 1.5px;
    background: linear-gradient(to right, var(--dourado), rgba(201,169,110,0.3));
  }

  .tag {
    position: absolute;
    top: 75px;
    left: 60px;
    color: var(--terracota);
    font-size: 15px;
    font-weight: 400;
    letter-spacing: 6px;
    text-transform: uppercase;
  }

  .num-slide {
    position: absolute;
    top: -20px;
    right: 30px;
    font-size: 340px;
    font-weight: 900;
    color: var(--dourado);
    opacity: 0.04;
    line-height: 1;
  }

  /* Headline de virada — grande, impacto */
  .virada-headline {
    position: absolute;
    top: 155px;
    left: 60px;
    right: 60px;
  }

  .virada-headline .subtag {
    font-size: 18px;
    font-weight: 400;
    font-style: italic;
    color: var(--dourado);
    letter-spacing: 1px;
    margin-bottom: 28px;
  }

  .virada-headline h2 {
    font-size: 68px;
    font-weight: 900;
    line-height: 1.0;
    letter-spacing: -1.5px;
    text-transform: uppercase;
    color: var(--texto-claro);
  }

  .virada-headline h2 .dourado { color: var(--dourado); }
  .virada-headline h2 .terracota { color: var(--terracota); }

  /* Bloco explicativo */
  .explicacao {
    position: absolute;
    top: 570px;
    left: 60px;
    right: 60px;
    border-top: 1px solid rgba(201,169,110,0.3);
    padding-top: 44px;
  }

  .explicacao p {
    font-size: 34px;
    font-weight: 400;
    line-height: 1.55;
    color: var(--texto-claro);
    opacity: 0.85;
    margin-bottom: 36px;
  }

  .explicacao p strong {
    font-weight: 700;
    color: var(--dourado-claro);
    font-style: normal;
  }

  /* Caixa de insight */
  .caixa-insight {
    position: absolute;
    bottom: 175px;
    left: 60px;
    right: 60px;
    background: rgba(201,169,110,0.08);
    border: 1px solid rgba(201,169,110,0.25);
    padding: 32px 36px;
  }

  .caixa-insight p {
    font-size: 30px;
    font-weight: 700;
    font-style: italic;
    line-height: 1.45;
    color: var(--dourado-claro);
  }

  .linha-base {
    position: absolute;
    bottom: 100px;
    left: 60px;
    right: 60px;
    height: 1px;
    background: rgba(201,169,110,0.2);
  }

  .handle {
    position: absolute;
    bottom: 62px;
    left: 60px;
    color: var(--dourado);
    font-size: 19px;
    font-weight: 400;
    letter-spacing: 3px;
  }

  .slide-label {
    position: absolute;
    bottom: 65px;
    right: 60px;
    color: var(--texto-sutil);
    font-size: 14px;
    letter-spacing: 3px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="slide">
  <div class="faixa-lateral"></div>
  <div class="num-slide">4</div>
  <div class="linha-topo"></div>
  <div class="tag">A Virada</div>

  <div class="virada-headline">
    <div class="subtag">O que a maioria não percebe:</div>
    <h2>
      Taxa de<br>fechamento é<br>
      uma <span class="dourado">consequência.</span><br>
      Não uma<br><span class="terracota">alavanca.</span>
    </h2>
  </div>

  <div class="explicacao">
    <p>
      Você não melhora fechamento<br>
      <strong>pensando em fechamento.</strong>
    </p>
    <p>
      Você melhora <strong>volume.</strong><br>
      E volume te dá os dados reais<br>
      para melhorar tudo o mais.
    </p>
  </div>

  <div class="linha-base"></div>
  <div class="handle">@glendonassis</div>
  <div class="slide-label">04 / 09</div>
</div>
</body>
</html>
