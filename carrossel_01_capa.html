<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --dourado: #C9A96E;
    --dourado-claro: #E8C98A;
    --dourado-escuro: #A07840;
    --bg-escuro: #1A1510;
    --bg-medio: #221C14;
    --texto-claro: #F5EFE6;
    --texto-sutil: #9A8870;
    --terracota: #C1622A;
  }

  body {
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    background: var(--bg-escuro);
    font-family: 'Playfair Display', Georgia, serif;
  }

  .slide {
    width: 1080px;
    height: 1350px;
    background: var(--bg-escuro);
    position: relative;
    overflow: hidden;
  }

  /* Textura sutil de fundo */
  .slide::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 80% 20%, rgba(201,169,110,0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 20% 80%, rgba(201,169,110,0.04) 0%, transparent 50%);
  }

  /* Linha topo */
  .linha-topo {
    position: absolute;
    top: 55px;
    left: 60px;
    right: 60px;
    height: 1.5px;
    background: linear-gradient(to right, var(--dourado), rgba(201,169,110,0.3));
  }

  /* Tag editorial */
  .tag {
    position: absolute;
    top: 75px;
    left: 60px;
    color: var(--dourado);
    font-size: 15px;
    font-weight: 400;
    letter-spacing: 6px;
    text-transform: uppercase;
    font-family: 'Playfair Display', Georgia, serif;
  }

  /* Número do slide watermark */
  .num-slide {
    position: absolute;
    top: -30px;
    right: 40px;
    font-size: 340px;
    font-weight: 900;
    color: var(--dourado);
    opacity: 0.04;
    line-height: 1;
    pointer-events: none;
    font-family: 'Playfair Display', Georgia, serif;
  }

  /* Bloco central */
  .conteudo {
    position: absolute;
    top: 160px;
    left: 60px;
    right: 60px;
  }

  /* Linha decorativa antes do headline */
  .linha-acento {
    width: 50px;
    height: 3px;
    background: var(--terracota);
    margin-bottom: 36px;
  }

  .headline {
    font-size: 78px;
    font-weight: 900;
    line-height: 0.95;
    letter-spacing: -2px;
    text-transform: uppercase;
    color: var(--texto-claro);
    margin-bottom: 0;
  }

  .headline .dourado {
    color: var(--dourado);
  }

  /* Separador */
  .divisor {
    width: 100%;
    height: 1px;
    background: rgba(201,169,110,0.25);
    margin: 56px 0;
  }

  .subtexto {
    font-size: 30px;
    font-weight: 400;
    font-style: italic;
    line-height: 1.5;
    color: var(--texto-claro);
    opacity: 0.82;
    max-width: 820px;
  }

  .subtexto strong {
    font-style: normal;
    font-weight: 700;
    color: var(--dourado);
  }

  /* Bloco de citação do insight */
  .insight-box {
    position: absolute;
    bottom: 200px;
    left: 60px;
    right: 60px;
    border-left: 3px solid var(--dourado);
    padding-left: 28px;
  }

  .insight-box .insight-text {
    font-size: 26px;
    font-weight: 400;
    font-style: italic;
    color: var(--texto-claro);
    opacity: 0.6;
    line-height: 1.55;
  }

  /* Linha base */
  .linha-base {
    position: absolute;
    bottom: 100px;
    left: 60px;
    right: 60px;
    height: 1px;
    background: rgba(201,169,110,0.25);
  }

  /* Handle */
  .handle {
    position: absolute;
    bottom: 62px;
    left: 60px;
    color: var(--dourado);
    font-size: 19px;
    font-weight: 400;
    letter-spacing: 3px;
    text-transform: lowercase;
  }

  .slide-label {
    position: absolute;
    bottom: 65px;
    right: 60px;
    color: var(--texto-sutil);
    font-size: 14px;
    letter-spacing: 3px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="slide">
  <div class="num-slide">1</div>
  <div class="linha-topo"></div>
  <div class="tag">Vendas · Mentorias</div>

  <div class="conteudo">
    <div class="linha-acento"></div>
    <h1 class="headline">
      O mentor que<br>
      controla tudo —<br>
      menos o que<br>
      <span class="dourado">funciona.</span>
    </h1>
    <div class="divisor"></div>
    <p class="subtexto">
      Você não controla quantas pessoas fecham com você.<br>
      Você controla <strong>quantas ligações vai fazer.</strong>
    </p>
  </div>

  <div class="linha-base"></div>
  <div class="handle">@glendonassis</div>
  <div class="slide-label">01 / 09</div>
</div>
</body>
</html>
