<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --dourado: #C9A96E;
    --dourado-claro: #E8C98A;
    --bg-escuro: #1A1510;
    --texto-claro: #F5EFE6;
    --texto-sutil: #9A8870;
    --terracota: #C1622A;
  }

  body {
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    background: var(--bg-escuro);
    font-family: 'Playfair Display', Georgia, serif;
  }

  .slide {
    width: 1080px;
    height: 1350px;
    background: var(--bg-escuro);
    position: relative;
    overflow: hidden;
  }

  .slide::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 15% 30%, rgba(201,169,110,0.05) 0%, transparent 55%);
  }

  .linha-topo {
    position: absolute;
    top: 55px;
    left: 60px;
    right: 60px;
    height: 1.5px;
    background: linear-gradient(to right, var(--dourado), rgba(201,169,110,0.3));
  }

  .tag {
    position: absolute;
    top: 75px;
    left: 60px;
    color: var(--dourado);
    font-size: 15px;
    font-weight: 400;
    letter-spacing: 6px;
    text-transform: uppercase;
  }

  .num-slide {
    position: absolute;
    top: -20px;
    right: 30px;
    font-size: 340px;
    font-weight: 900;
    color: var(--dourado);
    opacity: 0.04;
    line-height: 1;
    pointer-events: none;
  }

  /* Título */
  .titulo-bloco {
    position: absolute;
    top: 155px;
    left: 60px;
    right: 60px;
  }

  .titulo-bloco .linha-acento {
    width: 50px;
    height: 3px;
    background: var(--dourado);
    margin-bottom: 32px;
  }

  .titulo {
    font-size: 62px;
    font-weight: 900;
    line-height: 1.0;
    letter-spacing: -1.5px;
    text-transform: uppercase;
    color: var(--texto-claro);
  }

  .titulo .dourado { color: var(--dourado); }

  /* Lista de ações feitas */
  .lista-acoes {
    position: absolute;
    top: 500px;
    left: 60px;
    right: 60px;
  }

  .lista-acoes .item {
    display: flex;
    align-items: flex-start;
    gap: 20px;
    margin-bottom: 30px;
  }

  .lista-acoes .item .marcador {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--dourado);
    margin-top: 16px;
    flex-shrink: 0;
  }

  .lista-acoes .item .texto {
    font-size: 32px;
    font-weight: 400;
    color: var(--texto-claro);
    opacity: 0.8;
    line-height: 1.4;
  }

  /* Bloco de virada */
  .virada-bloco {
    position: absolute;
    bottom: 160px;
    left: 60px;
    right: 60px;
    border-top: 1px solid rgba(201,169,110,0.3);
    padding-top: 40px;
  }

  .virada-bloco .texto-virada {
    font-size: 35px;
    font-weight: 700;
    font-style: italic;
    line-height: 1.4;
    color: var(--texto-claro);
  }

  .virada-bloco .texto-virada .dourado {
    color: var(--dourado);
  }

  .linha-base {
    position: absolute;
    bottom: 100px;
    left: 60px;
    right: 60px;
    height: 1px;
    background: rgba(201,169,110,0.2);
  }

  .handle {
    position: absolute;
    bottom: 62px;
    left: 60px;
    color: var(--dourado);
    font-size: 19px;
    font-weight: 400;
    letter-spacing: 3px;
  }

  .slide-label {
    position: absolute;
    bottom: 65px;
    right: 60px;
    color: var(--texto-sutil);
    font-size: 14px;
    letter-spacing: 3px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="slide">
  <div class="num-slide">2</div>
  <div class="linha-topo"></div>
  <div class="tag">O Problema</div>

  <div class="titulo-bloco">
    <div class="linha-acento"></div>
    <h2 class="titulo">
      Você ajustou<br>
      tudo. O resultado<br>
      <span class="dourado">não veio.</span>
    </h2>
  </div>

  <div class="lista-acoes">
    <div class="item">
      <div class="marcador"></div>
      <span class="texto">Revisou a oferta.</span>
    </div>
    <div class="item">
      <div class="marcador"></div>
      <span class="texto">Reescreveu a copy.</span>
    </div>
    <div class="item">
      <div class="marcador"></div>
      <span class="texto">Testou outro preço.</span>
    </div>
    <div class="item">
      <div class="marcador"></div>
      <span class="texto">Ensaiou o pitch.</span>
    </div>
    <div class="item">
      <div class="marcador"></div>
      <span class="texto">Esperou o cliente certo aparecer.</span>
    </div>
  </div>

  <div class="virada-bloco">
    <p class="texto-virada">
      O problema não é o que você está ajustando.<br>
      É o que você está tentando <span class="dourado">controlar.</span>
    </p>
  </div>

  <div class="linha-base"></div>
  <div class="handle">@glendonassis</div>
  <div class="slide-label">02 / 09</div>
</div>
</body>
</html>
